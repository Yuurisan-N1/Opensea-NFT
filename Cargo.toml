[package]
name = "opensea-mint-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "opensea-mint-bot"
path = "src/main.rs"

[lib]
name = "opensea_mint"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "connect", "handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
simd-json = "0.13"
ethers = { version = "2", features = ["rustls", "ws"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
hex = "0.4"
chrono = "0.4"
reqwest = { version = "0.11", features = ["socks", "rustls-tls", "json"], default-features = false }
figlet-rs = "0.1"
url = "2"
regex = "1"
futures-util = "0.3"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
